version: '3.7'

services:
  prometheus:
    image: prom/prometheus:v2.44.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - monitoring-network
  
  grafana:
    image: grafana/grafana:9.5.3
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=your_secure_password
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - monitoring-network
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    command: -port=8080
    privileged: true
    security_opt:  # <-- This is the key
      - seccomp:unconfined
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro # Corrected path
    ports:
      - "8080:8080"
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
    networks:
      - monitoring-network

  node-exporter:
    image: prom/node-exporter:v1.6.0
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    deploy:
      mode: global
    networks:
      - monitoring-network

volumes:
  grafana-data:
  
networks:
  monitoring-network:
    driver: overlay
global:
  scrape_interval: 15s

scrape_configs:
  # مهمة لمراقبة Prometheus نفسه
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # مهمة لمراقبة Node Exporter باستخدام الاكتشاف التلقائي
  - job_name: 'node-exporter'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+:\d+)
        target_label: __address__
        replacement: $1:9100
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance

  # مهمة لمراقبة cAdvisor باستخدام الاكتشاف التلقائي
  - job_name: 'cadvisor'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: monitoring_cadvisor
        action: keep
      - source_labels: [__address__]
        regex: (.+:\d+)
        target_label: __address__
        replacement: $1:8080
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance

  # مهمة لمراقبة خدماتك المخصصة (المضروب والمصفوفات)
  - job_name: 'custom_services'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: fact_.*|matrix_.*
        action: keep
      - source_labels: [__address__]
        regex: (.+:\d+)
        target_label: __address__
        replacement: $1:8000
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node_name
      - source_labels: [__meta_dockerswarm_container_id]
        target_label: container_id
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service_name
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.44.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: alert_rules_config
        target: /etc/prometheus/alert.rules.yml
    networks:
      - monitor-net
    ports:
      - "9090:9090"
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:9.5.3
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=your_secure_password
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitor-net
    ports:
      - "3000:3000"
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - target: 8080
        published: 18150
        protocol: tcp
        mode: host
    networks:
      - monitor-net
    deploy:
      mode: global

  node-exporter:
    image: prom/node-exporter:v1.6.0
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    ports:
      - target: 9100
        published: 19100
        protocol: tcp
        mode: host
    networks:
      - monitor-net
    deploy:
      mode: global

  fact_100k:
    image: devaimax/factorial_100k:latest
    environment:
      - SERVICE_NAME=fact_100k
      - NODE_NAME={{.Node.Hostname}}
      - N=100000
    networks:
      - monitor-net
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-01
    ports:
      - target: 8000
        published: 18200
        protocol: tcp
        mode: host

  fact_200k:
    image: devaimax/factorial_200k:latest
    environment:
      - SERVICE_NAME=fact_200k
      - NODE_NAME={{.Node.Hostname}}
      - N=200000
    networks:
      - monitor-net
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-02
    ports:
      - target: 8000
        published: 18210
        protocol: tcp
        mode: host

  fact_300k:
    image: devaimax/factorial_300k:latest
    environment:
      - SERVICE_NAME=fact_300k
      - NODE_NAME={{.Node.Hostname}}
      - N=300000
    networks:
      - monitor-net
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-03
    ports:
      - target: 8000
        published: 18220
        protocol: tcp
        mode: host

  fact_400k:
    image: devaimax/factorial_400k:latest
    environment:
      - SERVICE_NAME=fact_400k
      - NODE_NAME={{.Node.Hostname}}
      - N=400000
    networks:
      - monitor-net
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-04
    ports:

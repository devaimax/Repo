        published: 18230
        protocol: tcp
        mode: host

  fact_500k:
    image: devaimax/factorial_500k:latest
    environment:
      - SERVICE_NAME=fact_500k
      - NODE_NAME={{.Node.Hostname}}
      - N=500000
    networks:

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 25s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    scrape_timeout: 25s
    static_configs:
      - targets: ['192.168.20.35:18150']
        labels: {node: 'Master'}
      - targets: ['192.168.20.5:18150']
        labels: {node: 'node-01'}
      - targets: ['192.168.20.6:18150']
        labels: {node: 'node-02'}
      - targets: ['192.168.20.7:18150']
        labels: {node: 'node-03'}
      - targets: ['192.168.20.8:18150']
        labels: {node: 'node-04'}

  - job_name: 'node-exporter'
    scrape_timeout: 20s
    static_configs:
      - targets: ['192.168.20.35:19100']
        labels: {node: 'Master'}
      - targets: ['192.168.20.5:19100']
        labels: {node: 'node-01'}
      - targets: ['192.168.20.6:19100']
        labels: {node: 'node-02'}
      - targets: ['192.168.20.7:19100']
        labels: {node: 'node-03'}
      - targets: ['192.168.20.8:19100']
        labels: {node: 'node-04'}

  - job_name: 'custom_services'
    scrape_timeout: 15s
    static_configs:
      - targets: ['192.168.20.5:18200']
        labels:
          service: 'fact_100k'
          service_type: 'factorial'
          node: 'node-01'
          ip: '192.168.20.5'
      - targets: ['192.168.20.6:18210']
        labels:
          service: 'fact_200k'
          service_type: 'factorial'
          node: 'node-02'
          ip: '192.168.20.6'
      - targets: ['192.168.20.7:18220']
        labels:
          service: 'fact_300k'
          service_type: 'factorial'
          node: 'node-03'
          ip: '192.168.20.7'
      - targets: ['192.168.20.8:18230']
        labels:
          service: 'fact_400k'
          service_type: 'factorial'
          node: 'node-04'
          ip: '192.168.20.8'
      - targets: ['192.168.20.8:18240']
        labels:
          service: 'fact_500k'
          service_type: 'factorial'
          node: 'node-04'
          ip: '192.168.20.8'
      - targets: ['192.168.20.5:18260']
        labels:
          service: 'matrix_4k'
          service_type: 'matrix'
          node: 'node-01'
          ip: '192.168.20.5'
      - targets: ['192.168.20.6:18270']
        labels:
          service: 'matrix_5k'
          service_type: 'matrix'
          node: 'node-02'
          ip: '192.168.20.6'
      - targets: ['192.168.20.7:18280']
        labels:
          service: 'matrix_6k'
          service_type: 'matrix'
          node: 'node-03'
          ip: '192.168.20.7'
      - targets: ['192.168.20.8:18290']
        labels:
          service: 'matrix_7k'
          service_type: 'matrix'
          node: 'node-04'
          ip: '192.168.20.8'
      - targets: ['192.168.20.7:18300']
        labels:
          service: 'matrix_8k'
          service_type: 'matrix'
          node: 'node-03'
          ip: '192.168.20.7'

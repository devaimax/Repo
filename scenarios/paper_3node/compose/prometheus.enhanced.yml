global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 25s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    scrape_timeout: 10s
    static_configs:
      - targets: ['192.168.20.35:9090']

  - job_name: 'cadvisor'
    scrape_timeout: 25s
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.20.35:18050']
        labels:
          node: 'Master'
      - targets: ['192.168.20.5:18050']
        labels:
          node: 'node-01'
      - targets: ['192.168.20.6:18050']
        labels:
          node: 'node-02'

  - job_name: 'node-exporter'
    scrape_timeout: 20s
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.20.35:9100']
        labels:
          node: 'Master'
      - targets: ['192.168.20.5:9100']
        labels:
          node: 'node-01'
      - targets: ['192.168.20.6:9100']
        labels:
          node: 'node-02'

  - job_name: 'custom_services'
    scrape_timeout: 15s
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.20.5:18000']
        labels:
          service: 'fact_100k'
          node: 'node-01'
      - targets: ['192.168.20.6:18010']
        labels:
          service: 'fact_300k'
          node: 'node-02'
      - targets: ['192.168.20.35:18020']
        labels:
          service: 'fact_500k'
          node: 'Master'
      - targets: ['192.168.20.5:18030']
        labels:
          service: 'matrix_4k'
          node: 'node-01'
      - targets: ['192.168.20.6:18040']
        labels:
          service: 'matrix_5k'
          node: 'node-02'

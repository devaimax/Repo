version: "3.8"

services:
  prometheus:
    network_mode: host
    ports: []
    networks: []

  cadvisor:
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

  node-exporter:
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host

  fact_100k:
    ports:
      - target: 8000
        published: 18000
        protocol: tcp
        mode: host
    environment:
      - SERVICE_NAME=fact_100k
      - NODE_NAME=Master
      - N=100000
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == Master

  fact_300k:
    ports:
      - target: 8000
        published: 18010
        protocol: tcp
        mode: host
    environment:
      - SERVICE_NAME=fact_300k
      - NODE_NAME=node-0a
      - N=300000
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-0a

  fact_500k:
    ports:
      - target: 8000
        published: 18020
        protocol: tcp
        mode: host
    environment:
      - SERVICE_NAME=fact_500k
      - NODE_NAME=node-0b
      - N=500000
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-0b

  matrix_4k:
    ports:
      - target: 8000
        published: 18030
        protocol: tcp
        mode: host
    environment:
      - SERVICE_NAME=matrix_4k
      - NODE_NAME=node-0a
      - MATRIX_SIZE=4000
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-0a

  matrix_5k:
    ports:
      - target: 8000
        published: 18040
        protocol: tcp
        mode: host
    environment:
      - SERVICE_NAME=matrix_5k
      - NODE_NAME=node-0b
      - MATRIX_SIZE=5000
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == node-0b

  elasticsearch:
    ports:
      - target: 9200
        published: 9200
        protocol: tcp
        mode: host
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.hostname == Master

networks:
  monitor-net:
    external: true
